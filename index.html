<!-- The Corporate Aloo - Submission Form Section -->
<form action="https://formspree.io/f/thecorporatepotato.work1@gmail.com" method="POST" class="space-y-4">
  
  <!-- Instagram Input -->
  <div class="relative">
    <label for="instagram" class="block text-xs font-bold uppercase tracking-wider text-neutral-500 mb-1">Your Instagram @ (Optional)</label>
    <input 
      type="text" 
      id="instagram" 
      name="instagram" 
      placeholder="@yourusername" 
      class="w-full px-4 py-3 rounded-xl border border-neutral-300 focus:outline-none focus:border-purple-600 text-sm font-medium bg-white"
    >
  </div>

  <!-- Idea / Storyline Input -->
  <div class="relative">
    <label for="idea" class="block text-xs font-bold uppercase tracking-wider text-neutral-500 mb-1">Your Idea / Storyline</label>
    <input 
      type="text" 
      id="idea" 
      name="idea" 
      required
      placeholder="e.g. Diwali bonus comedy skit..." 
      class="w-full px-4 py-3 rounded-xl border border-neutral-300 focus:outline-none focus:border-purple-600 text-sm font-medium bg-white"
    >
  </div>

  <!-- Submit Button -->
  <button 
    type="submit" 
    class="w-full py-4 bg-[#ccff00] text-neutral-900 font-extrabold rounded-xl shadow-md hover:bg-[#b3e600] transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wider cursor-pointer"
  >
    Submit My Idea ↗
  </button>

</form>
